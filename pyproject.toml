[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallpaper-changer"
dynamic = ["version"]
description = "Automatic dark/light wallpapers for Windows, macOS and Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Des" }]
keywords = ["wallpaper", "unsplash", "bing", "tray", "dark-mode", "light-mode"]
classifiers = [
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pystray>=0.19.5",
    "Pillow>=10.0",
    "requests>=2.32",
    "customtkinter>=5.2",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/desorderrr/wallpaper-changer"
"Source Code" = "https://github.com/desorderrr/wallpaper-changer"
"Bug Tracker" = "https://github.com/desorderrr/wallpaper-changer/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pyinstaller>=6.10"]

[project.gui-scripts]
wallpaper-changer = "wallpaper_changer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "wallpaper_changer.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "W", "I", "UP", "B", "BLE", "SIM",
    "RUF", "S", "PL", "PIE", "RET", "FURB",
]
ignore = [
    "UP031",    # the project uses % formatting by style
    "UP009",    # encoding headers are a project convention
    "S110",     # try/except/pass in best-effort operations
    "S112",     # try/except/continue in image sources is intentional
    "PLW1510",  # subprocess.run without check is intentional
    "PLC0415",  # imports inside functions are deliberate lazy imports
    "PLW0603",  # global used for module-level caches
    "PLR2004",  # magic-value comparisons are readable in context
    "SIM105",   # except pass in best-effort operations
    "S603",     # subprocess without shell is the safe default
    "S607",     # system commands (osascript, qdbus, …) come from PATH
    "S311",     # non-cryptographic random is fine for wallpapers
    "PLR0913",  # constructors with dependency injection
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are the point of tests
