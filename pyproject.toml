[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallpaper-changer"
version = "2.2.0"
description = "Wallpapers automáticos escuros/claros para Windows, macOS e Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Des" }]
keywords = ["wallpaper", "unsplash", "bing", "tray", "dark-mode", "light-mode"]
classifiers = [
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pystray>=0.19.5",
    "Pillow>=10.0",
    "requests>=2.31",
    "customtkinter>=5.2",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.10"]

[project.gui-scripts]
wallpaper-changer = "wallpaper_changer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
