[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallpaper-changer"
dynamic = ["version"]
description = "Wallpapers automáticos escuros/claros para Windows, macOS e Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Des" }]
keywords = ["wallpaper", "unsplash", "bing", "tray", "dark-mode", "light-mode"]
classifiers = [
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pystray>=0.19.5",
    "Pillow>=10.0",
    "requests>=2.32",
    "customtkinter>=5.2",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/desorderrr/wallpaper-changer"
"Source Code" = "https://github.com/desorderrr/wallpaper-changer"
"Bug Tracker" = "https://github.com/desorderrr/wallpaper-changer/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pyinstaller>=6.10"]

[project.gui-scripts]
wallpaper-changer = "wallpaper_changer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "wallpaper_changer.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "W", "I", "UP", "B", "BLE", "SIM",
    "RUF", "S", "PL", "PIE", "RET", "FURB",
]
ignore = [
    "UP031",    # o projeto usa formatação % por estilo
    "UP009",    # cabeçalhos de encoding são convenção do projeto
    "S110",     # try/except/pass em operações best-effort
    "S112",     # try/except/continue nas fontes de imagens é intencional
    "PLW1510",  # subprocess.run sem check é propositado
    "PLC0415",  # imports dentro de funções são lazy imports deliberados
    "PLW0603",  # global usado para caches à escala do módulo
    "PLR2004",  # comparações com valores mágicos legíveis no contexto
    "SIM105",   # except pass em operações best-effort
    "S603",     # subprocess sem shell é o comportamento seguro por omissão
    "S607",     # comandos de sistema (osascript, qdbus, …) vêm do PATH
    "S311",     # random não criptográfico é aceitável para wallpapers
    "PLR0913",  # construtores com injeção de dependências
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts são a essência dos testes
