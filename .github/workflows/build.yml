name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install --upgrade pip && pip install ".[dev]"
      - name: Ruff check
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests

  test:
    name: Testes (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb libgtk-3-0

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Testes (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -q --cov=wallpaper_changer --cov-report=term-missing

      - name: Testes (macOS)
        if: runner.os == 'macOS'
        env:
          WPC_SKIP_UI_TESTS: "1"
        run: pytest -q --cov=wallpaper_changer --cov-report=term-missing

      - name: Testes (Windows)
        if: runner.os == 'Windows'
        run: pytest -q --cov=wallpaper_changer --cov-report=term-missing

  build:
    name: Build (${{ matrix.os }})
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: WallpaperChanger-windows
          - os: ubuntu-22.04
            artifact: WallpaperChanger-linux
          - os: macos-latest
            artifact: WallpaperChanger-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgtk-3-0 zip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ícones
        run: python scripts/make_icon.py

      - name: Build Windows
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed `
            --name WallpaperChanger --icon icon.ico `
            --hidden-import pystray._win32 `
            --collect-all customtkinter --paths src scripts/launcher.py
          Compress-Archive -Path dist\WallpaperChanger.exe `
            -DestinationPath dist\WallpaperChanger-windows.zip

      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --noconfirm --onefile \
            --name wallpaper-changer \
            --hidden-import pystray._xorg \
            --collect-all customtkinter --paths src scripts/launcher.py
          chmod +x dist/wallpaper-changer
          (cd dist && zip WallpaperChanger-linux.zip wallpaper-changer)

      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed \
            --name WallpaperChanger --icon icon.icns \
            --hidden-import pystray._darwin \
            --collect-all customtkinter --paths src scripts/launcher.py
          ditto -c -k --sequesterRsrc --keepParent \
            dist/WallpaperChanger.app dist/WallpaperChanger-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Reunir zips
        run: |
          cd artifacts
          find . -name '*.zip' -exec mv {} . \;
          ls -la *.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
